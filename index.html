<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&family=Merriweather:wght@400;700&family=Roboto:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <h2>To-Do List <img src="image/to-do-list.png" alt="logo" /></h2>
        <div class="controls">
          <label for="font-select">Font</label>
          <select id="font-select" aria-label="Select app font">
            <option
              value="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
            >
              Inter
            </option>
            <option
              value="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Arial"
            >
              Poppins
            </option>
            <option value="Merriweather, serif">Merriweather</option>
            <option value="Roboto, system-ui, -apple-system, 'Segoe UI', Arial">
              Roboto
            </option>
            <option value="Lato, system-ui, -apple-system, 'Segoe UI', Roboto">
              Lato
            </option>
          </select>
          <button id="clear-btn" class="ghost">Clear All</button>
        </div>
        <div class="row">
          <input
            type="text"
            id="input-box"
            placeholder="Enter Your Text Here"
          />
          <button onclick="addTask()">ADD</button>
        </div>
        <ul id="list-container">
          <!-- list items go here -->
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
